# An instance Deployment scaled to zero: stop_instance's fast path, which must
# stay distinguishable from the absent-field case above.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foreman
  namespace: foreman
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: foreman
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foreman
    spec:
      containers:
        - name: foreman
          image: ghcr.io/tsic404/foreman:latest
