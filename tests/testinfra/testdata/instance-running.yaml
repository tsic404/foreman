# An instance Deployment that names more than one replica: any nonzero count
# brings the scale, never the "already stopped" fast path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foreman
  namespace: foreman
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: foreman
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foreman
    spec:
      containers:
        - name: foreman
          image: ghcr.io/tsic404/foreman:latest
