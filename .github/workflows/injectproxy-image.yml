# Publish the fault-injection access path image.
#
# This component is test infrastructure, not part of the Foreman release, so
# it has its own workflow instead of a third entry in build-images.yml — the
# release record there (product image digests, upstream artifact provenance) is
# about the two images the deploy/ surface consumes. The test cluster pulls
# this image next to the test multica server
# (testinfra/injectproxy/README.md, test-cases/_infra/test-multica-cluster.md
# §2/§4).
name: injectproxy-image

on:
  push:
    branches: [main]
    paths:
      - "cmd/injectproxy/**"
      - "internal/injectproxy/**"
      - "images/injectproxy.Containerfile"
      - "Makefile"
      - ".github/workflows/injectproxy-image.yml"
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: injectproxy-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.FOREMAN_RELEASE_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the newest reachable v*.*.* tag names the version

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          else
            version=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || make -s print-version)
          fi
          [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error title=Version resolution failed::$version is not a v<major>.<minor>.<patch> tag"
            exit 1
          }
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "publishing foreman-injectproxy $version from $GITHUB_SHA" >>"$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the injector image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ vars.FOREMAN_REGISTRY || 'ghcr.io/tsic404' }}
          BASE_IMAGE: ${{ vars.FOREMAN_BASE_IMAGE || 'alpine:3.20' }}
          # `latest` tracks main only: an older tag build must not move it back.
          PUSH_LATEST: ${{ github.ref_type == 'tag' && '0' || '1' }}
        run: |
          set -euo pipefail
          image="$REGISTRY/foreman-injectproxy:$VERSION"
          make build-injectproxy-image VERSION="$VERSION" REGISTRY="$REGISTRY" \
            BASE_IMAGE="$BASE_IMAGE" CONTAINER_TOOL=docker
          docker push "$image"
          if [ "$PUSH_LATEST" = 1 ]; then
            docker tag "$image" "$REGISTRY/foreman-injectproxy:latest"
            docker push "$REGISTRY/foreman-injectproxy:latest"
          fi
