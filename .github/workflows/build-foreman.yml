# Publish the scheduler image:
# `foreman:<version>` for the Deployment, as a multi-platform manifest list
# (linux/amd64 + linux/arm64), so a mixed-architecture cluster pulls the
# platform its node runs.
#
# The release path lives entirely in this workflow: no repository scripts, no
# make targets (the Makefile is local development only). This line's version
# semantics are this repository's: a `v*.*.*` tag push publishes exactly
# `foreman:v<X.Y.Z>` and leaves `latest` where it is; every other run — a `main`
# push, or a manual dispatch as its re-run entry point — publishes exactly
# `foreman:latest` and no version tag. A published version tag therefore always
# names the image built from that tag, which ADR-012 keeps as the rollback path.
#
# The Job image has its own line (build-foreman-job.yml) and its own version
# semantics (the upstream daemon's). The two are independent: this workflow
# never builds the Job image, and a Job-image run never builds this one.
#
# A failed step fails the run: the build/push step's exit code is the only
# signal this workflow produces — non-zero means the push did not complete, and
# a partial push may have landed (check the registry before re-running). What
# the published image contains is judged by the design's acceptance cases
# (TC-tech-job-08 / TC-tech-provenance-01), not here.
name: build-foreman

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-foreman-${{ github.ref }}
  cancel-in-progress: false

env:
  # Every release carries both platforms.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    # Hosted runners reach GHCR; FOREMAN_RELEASE_RUNNER (JSON label array)
    # overrides them when the images must be built behind the tailnet.
    runs-on: ${{ fromJSON(vars.FOREMAN_RELEASE_RUNNER || '["ubuntu-latest"]') }}
    steps:
      # Shallow is enough: the version comes from the ref, and the release
      # record needs only HEAD's short sha.
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # the per-platform binaries below build here

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
            [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error title=Version resolution failed::$version is not a v<major>.<minor>.<patch> tag"
              exit 1
            }
          else
            version=latest
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the per-platform binary
        env:
          # The binary reports the version its image carries: v<X.Y.Z> from a tag
          # push, latest from a main push.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # The Containerfile copies dist/foreman-linux-<arch>: both platforms
          # sit side by side in the build context and buildx picks one per
          # platform.
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/foreman-linux-${arch}" ./cmd/foreman
          done
          ls -l dist

      - name: Build and push the image
        id: publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ vars.FOREMAN_REGISTRY || 'ghcr.io/tsic404' }}
          BASE_IMAGE: ${{ vars.FOREMAN_BASE_IMAGE || 'alpine:3.20' }}
        run: |
          set -euo pipefail
          ref="$REGISTRY/foreman:$VERSION"
          # One tag per run — the one the version resolution named.
          # --provenance=false: the published manifest list carries exactly the
          # two platform manifests, with no attestation entry beside them.
          docker buildx build \
            --file images/foreman.Containerfile \
            --platform "$PLATFORMS" \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --tag "$ref" \
            --provenance=false \
            --push dist
          echo "foreman_image=$ref" >>"$GITHUB_OUTPUT"
          echo "published $ref" >>"$GITHUB_STEP_SUMMARY"

      - name: Record what this run published
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ vars.FOREMAN_REGISTRY || 'ghcr.io/tsic404' }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          FOREMAN_IMAGE: ${{ steps.publish.outputs.foreman_image }}
        run: |
          set -euo pipefail
          sha7=$(git rev-parse --short=7 HEAD)
          mkdir -p dist
          # The record runs even when the run died (to leave the scene), so it
          # has to say which state this is: the push completed, or it did not
          # and may have partially landed.
          if [ "${PUBLISH_OUTCOME:-}" = success ]; then
            status=PUBLISHED
          else
            status=FAILED
          fi
          cat >dist/release-foreman.env <<EOF
          # The release record for this run. deploy/ is never backfilled from it
          # (ADR-012): the image is referenced by movable tag.
          GIT_SHA=$sha7
          VERSION=${VERSION:-}
          REGISTRY=${REGISTRY:-}
          PLATFORMS=${PLATFORMS:-}
          STATUS=$status
          FOREMAN_IMAGE=${FOREMAN_IMAGE:-}
          EOF
          case "$status" in
            PUBLISHED)
              {
                printf '## Foreman image %s (%s)\n\n' "$VERSION" "$sha7"
                printf '| Image | Reference |\n|---|---|\n'
                printf '| foreman | `%s` |\n' "$FOREMAN_IMAGE"
                printf '\n`%s` manifest list; the Deployment references it by movable tag (`deploy/30-foreman.yaml`).\n' "$PLATFORMS"
              } >>"$GITHUB_STEP_SUMMARY"
              ;;
            FAILED)
              printf '## Foreman image %s (%s)\n\nnot recorded as published (publish: %s) — a partial push may have landed; check the registry before re-running.\n' \
                "${VERSION:-<unresolved>}" "$sha7" "${PUBLISH_OUTCOME:-none}" >>"$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-foreman-${{ steps.version.outputs.version || github.run_id }}
          path: dist/release-foreman.env
          retention-days: 90

      - name: Report the failure
        if: failure()
        run: echo "::error title=Image delivery failed::this run was not recorded as published — a partial push may have landed; check the registry before re-running."
