# Publish the scheduler image:
# `foreman:<version>` (+ `latest`) for the Deployment, as a multi-platform
# manifest list (linux/amd64 + linux/arm64), so a mixed-architecture cluster
# pulls the platform its node runs.
#
# The release path lives entirely in this workflow: no repository scripts, no
# make targets (the Makefile is local development only). This line's version
# semantics are this repository's: `<version>` is the newest reachable
# `v*.*.*` tag (a manual dispatch may name one), and a `main` push also moves
# `latest` — an older tag build never moves it back.
#
# The Job image has its own line (build-foreman-job.yml) and its own version
# semantics (the upstream daemon's). The two are independent: this workflow
# never builds the Job image, and a Job-image run never builds this one.
#
# A failed step fails the run: the build/push step's exit code is the only
# signal this workflow produces — non-zero means the push did not complete, and
# a partial push may have landed (check the registry before re-running). What
# the published image contains is judged by the design's acceptance cases
# (TC-tech-job-08 / TC-tech-provenance-01), not here.
name: build-foreman

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (defaults to the newest v*.*.* tag, else v0.1.0)
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-foreman-${{ github.ref }}
  cancel-in-progress: false

env:
  # Every release carries both platforms.
  PLATFORMS: linux/amd64,linux/arm64
  # Version of a `main` push that predates the first v*.*.* tag (the same
  # default local builds stamp into the binary).
  DEFAULT_VERSION: v0.1.0

jobs:
  publish:
    # Hosted runners reach GHCR; FOREMAN_RELEASE_RUNNER (JSON label array)
    # overrides them when the images must be built behind the tailnet.
    runs-on: ${{ fromJSON(vars.FOREMAN_RELEASE_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the newest reachable v*.*.* tag names the release

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # the per-platform binaries below build here

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            version=$INPUT_VERSION
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          else
            version=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "$DEFAULT_VERSION")
          fi
          [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error title=Version resolution failed::$version is not a v<major>.<minor>.<patch> tag"
            exit 1
          }
          # `latest` tracks this repository's releases, so a run publishing an
          # older version must not move it back: a manual dispatch naming one
          # (`-f version=v0.1.0`) or a build of an old tag would otherwise roll
          # the Deployment back. The ordering source is this repo's v*.*.* tags;
          # with none published yet there is no ordering to violate, so a branch
          # run still moves `latest`. Decided here, after the version is known,
          # and never from a tag push.
          newest=$(git tag --sort=-v:refname --list 'v[0-9]*.[0-9]*.[0-9]*' | sed -n '1p')
          push_latest=0
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            if [ -z "$newest" ] || [ "$(printf '%s\n%s\n' "$version" "$newest" | sort -V | tail -n1)" = "$version" ]; then
              push_latest=1
            fi
          fi
          {
            printf 'version=%s\n' "$version"
            printf 'newest=%s\n' "$newest"
            printf 'push_latest=%s\n' "$push_latest"
          } >>"$GITHUB_OUTPUT"
          printf 'publishing foreman %s from %s (newest v*.*.* tag: %s; latest: %s)\n' \
            "$version" "$GITHUB_SHA" "${newest:-<none>}" \
            "$([ "$push_latest" = 1 ] && echo moves || echo stays)" >>"$GITHUB_STEP_SUMMARY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the per-platform binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # The Containerfile copies dist/foreman-linux-<arch>: both platforms
          # sit side by side in the build context and buildx picks one per
          # platform.
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/foreman-linux-${arch}" ./cmd/foreman
          done
          ls -l dist

      - name: Build and push the image
        id: publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NEWEST_TAG: ${{ steps.version.outputs.newest }}
          REGISTRY: ${{ vars.FOREMAN_REGISTRY || 'ghcr.io/tsic404' }}
          BASE_IMAGE: ${{ vars.FOREMAN_BASE_IMAGE || 'alpine:3.20' }}
          # `latest` moves only for a run publishing a version not older than the
          # newest v*.*.* tag, and never from a tag push (see the resolve step).
          PUSH_LATEST: ${{ steps.version.outputs.push_latest }}
        run: |
          set -euo pipefail
          ref="$REGISTRY/foreman:$VERSION"
          tags=(--tag "$ref")
          if [ "$PUSH_LATEST" = 1 ]; then
            tags+=(--tag "$REGISTRY/foreman:latest")
          else
            echo "\`$REGISTRY/foreman:latest\` left alone: this run publishes $VERSION, the newest v*.*.* tag is ${NEWEST_TAG:-<none>}." >>"$GITHUB_STEP_SUMMARY"
          fi
          # --provenance=false: the published manifest list carries exactly the
          # two platform manifests, with no attestation entry beside them.
          docker buildx build \
            --file images/foreman.Containerfile \
            --platform "$PLATFORMS" \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            "${tags[@]}" \
            --provenance=false \
            --push dist
          echo "foreman_image=$ref" >>"$GITHUB_OUTPUT"
          echo "published $ref" >>"$GITHUB_STEP_SUMMARY"

      - name: Record what this run published
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ vars.FOREMAN_REGISTRY || 'ghcr.io/tsic404' }}
          FOREMAN_IMAGE: ${{ steps.publish.outputs.foreman_image }}
        run: |
          set -euo pipefail
          sha7=$(git rev-parse --short=7 HEAD)
          mkdir -p dist
          cat >dist/release-foreman.env <<EOF
          # The release record for this run. deploy/ is never backfilled from it
          # (ADR-012): the image is referenced by movable tag.
          GIT_SHA=$sha7
          VERSION=$VERSION
          REGISTRY=$REGISTRY
          PLATFORMS=$PLATFORMS
          FOREMAN_IMAGE=$FOREMAN_IMAGE
          EOF
          {
            printf '## Foreman image %s (%s)\n\n' "$VERSION" "$sha7"
            printf '| Image | Reference |\n|---|---|\n'
            printf '| foreman | `%s` |\n' "$FOREMAN_IMAGE"
            printf '\n`%s` manifest list; the Deployment references it by movable tag (`deploy/30-foreman.yaml`).\n' "$PLATFORMS"
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-foreman-${{ steps.version.outputs.version }}
          path: dist/release-foreman.env
          retention-days: 90

      - name: Report the failure
        if: failure()
        run: echo "::error title=Image delivery failed::this run was not recorded as published — a partial push may have landed; check the registry before re-running."
