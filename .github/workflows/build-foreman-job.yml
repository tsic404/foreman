# Publish the Job image (04-architecture.md §部署/运行方式): the image the Job
# pods and the foreman-gc DaemonSet run, as a multi-platform manifest list
# (linux/amd64 + linux/arm64).
#
# This line's version semantics are the upstream daemon's, not this
# repository's: `<version>` is the multica release the image carries (resolved
# at build time from upstream's newest release — never from a repository
# variable), and `latest` follows the newest multica release. The image is
# referenced by movable tag (ADR-012); the published version tags are the
# rollback path, so a run never publishes `latest` alone.
#
# What the image carries is ADR-031: the upstream daemon CLI and `foreman-gc`,
# with no agent backend of its own — the template's init step installs `omp`
# into the Job at start-up, and the image keeps the C++ runtime that binary
# links against. `nix` is not part of the image either.
#
# The two release lines are independent: pushing a `foreman` tag or publishing
# `foreman:latest` never changes this image's version, and a run here never
# builds the scheduler image.
#
# Triggers: pushes to `main` (this repo's own changes — e.g. `foreman-gc` — and
# a sooner look at upstream), a periodic schedule (so a new upstream release is
# found while this repo sees no commits), and manual dispatch.
#
# Idempotent by version: when the resolved version is already published, the
# build and the push are skipped (no empty re-push) and the run records the
# skip — so the schedule and push triggers normally cost one registry query.
# `force` re-publishes on demand, which is how a `foreman-gc` fix lands under an
# already-published daemon version.
name: build-foreman-job

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Upstream daemon version to publish (defaults to upstream's newest release)
        required: false
      force:
        description: Build and push even when the version is already published
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-foreman-job
  cancel-in-progress: false

env:
  # Every release carries both platforms.
  PLATFORMS: linux/amd64,linux/arm64
  # The upstream daemon the Job image carries, and the release tags it comes
  # from (`v<version>`, its CLI assets named with the bare version).
  UPSTREAM_REPO: multica-ai/multica

jobs:
  publish:
    # Hosted runners reach GHCR and github.com; FOREMAN_RELEASE_RUNNER (JSON
    # label array) overrides them when the image must be built behind the
    # tailnet.
    runs-on: ${{ fromJSON(vars.FOREMAN_RELEASE_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # the per-platform foreman-gc below builds here

      - name: Resolve the upstream daemon version
        id: upstream
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Upstream's newest non-prerelease release, read off the redirect
          # GitHub serves for `releases/latest`: no API token, no rate limit,
          # and the same answer `gh release view --repo` would give.
          url=$(curl -fsSL -o /dev/null -w '%{url_effective}' \
            "https://github.com/$UPSTREAM_REPO/releases/latest")
          latest=${url##*/}
          latest=${latest#v}
          # A dispatch may name the version to publish (republishing an
          # already-published one, e.g. a foreman-gc fix). That run is not
          # necessarily upstream's newest release, and `latest` must not move
          # backwards: deployments reference `foreman-job:latest` with
          # imagePullPolicy: Always, so a backwards move downgrades every Job's
          # daemon. Both answers are resolved here; the publish step moves
          # `latest` only when they agree.
          if [ -n "$INPUT_VERSION" ]; then
            version=${INPUT_VERSION#v}
          else
            version=$latest
          fi
          for candidate in "$version" "$latest"; do
            [[ $candidate =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error title=Version resolution failed::$candidate is not a <major>.<minor>.<patch> upstream release"
              exit 1
            }
          done
          is_newest=false
          if [ "$version" = "$latest" ]; then
            is_newest=true
          fi
          {
            printf 'version=%s\n' "$version"
            printf 'latest=%s\n' "$latest"
            printf 'is_newest=%s\n' "$is_newest"
          } >>"$GITHUB_OUTPUT"
          printf 'upstream daemon version: %s (tag v%s); upstream newest: %s\n' \
            "$version" "$version" "$latest" >>"$GITHUB_STEP_SUMMARY"

      - name: Resolve the upstream CLI artifacts
        id: artifacts
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          # Both platforms must exist upstream, and each digest comes from the
          # release's own checksum manifest, never from a constant in this repo
          # (F1/AC-13 provenance).
          digest_of() { # <checksum-manifest-url> <asset-name>
            local sha
            sha=$(curl -fsSL "$1" | grep -E "[[:space:]]$2$" | cut -d' ' -f1 | head -n1)
            [[ $sha =~ ^[0-9a-f]{64}$ ]] || {
              echo "::error title=Upstream artifact missing::no SHA-256 for $2 in $1 (got '$sha')"
              exit 1
            }
            printf '%s' "$sha"
          }
          cli_base="https://github.com/$UPSTREAM_REPO/releases/download/v${VERSION}"
          for arch in amd64 arm64; do
            upper=$(printf '%s' "$arch" | tr '[:lower:]' '[:upper:]')
            cli_asset="multica-cli-${VERSION}-linux-${arch}.tar.gz"
            # Resolved into a variable first: a digest_of failure inside a
            # command substitution would only exit the subshell, and the step
            # would carry on with an empty digest.
            cli_sha=$(digest_of "$cli_base/checksums.txt" "$cli_asset")
            {
              printf 'MULTICA_CLI_URL_%s=%s/%s\n' "$upper" "$cli_base" "$cli_asset"
              printf 'MULTICA_CLI_SHA256_%s=%s\n' "$upper" "$cli_sha"
            } >>"$GITHUB_OUTPUT"
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip an already-published version
        id: gate
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          REGISTRY: ${{ vars.FOREMAN_REGISTRY || 'ghcr.io/tsic404' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          set -euo pipefail
          ref="$REGISTRY/foreman-job:$VERSION"
          if [ "$FORCE" != 1 ] && docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' "$ref" >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "::notice title=Already published::$ref exists; skipping the build and the push"
            echo "\`$ref\` is already published: build and push skipped." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Build the per-platform binary
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          # The Containerfile copies dist/foreman-gc-linux-<arch>: both
          # platforms sit side by side in the build context and buildx picks one
          # per platform.
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w" \
              -o "dist/foreman-gc-linux-${arch}" ./cmd/foreman-gc
          done
          ls -l dist

      - name: Build and push the image
        id: publish
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          LATEST_VERSION: ${{ steps.upstream.outputs.latest }}
          PUSH_LATEST: ${{ steps.upstream.outputs.is_newest }}
          REGISTRY: ${{ vars.FOREMAN_REGISTRY || 'ghcr.io/tsic404' }}
          BASE_IMAGE: ${{ vars.FOREMAN_BASE_IMAGE || 'alpine:3.20' }}
          MULTICA_CLI_URL_AMD64: ${{ steps.artifacts.outputs.MULTICA_CLI_URL_AMD64 }}
          MULTICA_CLI_SHA256_AMD64: ${{ steps.artifacts.outputs.MULTICA_CLI_SHA256_AMD64 }}
          MULTICA_CLI_URL_ARM64: ${{ steps.artifacts.outputs.MULTICA_CLI_URL_ARM64 }}
          MULTICA_CLI_SHA256_ARM64: ${{ steps.artifacts.outputs.MULTICA_CLI_SHA256_ARM64 }}
        run: |
          set -euo pipefail
          ref="$REGISTRY/foreman-job:$VERSION"
          tags=(--tag "$ref")
          # `latest` follows upstream's newest release, so only the run that
          # publishes that version moves it; the version tag is always pushed as
          # the rollback path.
          if [ "$PUSH_LATEST" = true ]; then
            tags+=(--tag "$REGISTRY/foreman-job:latest")
          else
            echo "\`$REGISTRY/foreman-job:latest\` left alone: upstream's newest release is $LATEST_VERSION, this run publishes $VERSION." >>"$GITHUB_STEP_SUMMARY"
          fi
          # --provenance=false: the published manifest list carries exactly the
          # two platform manifests, with no attestation entry beside them.
          docker buildx build \
            --file images/foreman-job.Containerfile \
            --platform "$PLATFORMS" \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --build-arg "MULTICA_CLI_URL_AMD64=$MULTICA_CLI_URL_AMD64" \
            --build-arg "MULTICA_CLI_SHA256_AMD64=$MULTICA_CLI_SHA256_AMD64" \
            --build-arg "MULTICA_CLI_URL_ARM64=$MULTICA_CLI_URL_ARM64" \
            --build-arg "MULTICA_CLI_SHA256_ARM64=$MULTICA_CLI_SHA256_ARM64" \
            "${tags[@]}" \
            --provenance=false \
            --push dist
          echo "foreman_job_image=$ref" >>"$GITHUB_OUTPUT"
          echo "published $ref" >>"$GITHUB_STEP_SUMMARY"

      - name: Record what this run published
        if: always()
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          REGISTRY: ${{ vars.FOREMAN_REGISTRY || 'ghcr.io/tsic404' }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          SKIPPED: ${{ steps.gate.outputs.skip }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          JOB_IMAGE: ${{ steps.publish.outputs.foreman_job_image }}
        run: |
          set -euo pipefail
          sha7=$(git rev-parse --short=7 HEAD)
          mkdir -p dist
          # The record runs even when the run died (to leave the scene), so it
          # has to say which state this is: published, skipped as already
          # published, or the push did not complete (it may have partially landed).
          if [ "${PUBLISH_OUTCOME:-}" = success ]; then
            status=PUBLISHED
          elif [ "${SKIPPED:-}" = true ]; then
            status=SKIPPED
          else
            status=FAILED
          fi
          cat >dist/release-foreman-job.env <<EOF
          # The release record for this run. deploy/ is never backfilled from it
          # (ADR-012): the Job image is referenced by movable tag.
          GIT_SHA=$sha7
          VERSION=${VERSION:-}
          REGISTRY=${REGISTRY:-}
          PLATFORMS=${PLATFORMS:-}
          UPSTREAM_RELEASE=https://github.com/$UPSTREAM_REPO/releases/tag/v${VERSION:-}
          STATUS=$status
          FOREMAN_JOB_IMAGE=${JOB_IMAGE:-}
          EOF
          case "$status" in
            PUBLISHED)
              {
                printf '## Foreman Job image %s (%s)\n\n' "$VERSION" "$sha7"
                printf '| Image | Reference |\n|---|---|\n'
                printf '| foreman-job | `%s` |\n' "$JOB_IMAGE"
                printf '\n`%s` manifest list; referenced by movable tag (`FOREMAN_JOB_IMAGE`).\n' "$PLATFORMS"
              } >>"$GITHUB_STEP_SUMMARY"
              ;;
            SKIPPED)
              printf '## Foreman Job image %s (%s)\n\nAlready published — build and push skipped.\n' \
                "$VERSION" "$sha7" >>"$GITHUB_STEP_SUMMARY"
              ;;
            FAILED)
              printf '## Foreman Job image %s (%s)\n\nnot recorded as published (gate: %s, publish: %s) — a partial push may have landed; check the registry before re-running.\n' \
                "${VERSION:-<unresolved>}" "$sha7" "${GATE_OUTCOME:-none}" "${PUBLISH_OUTCOME:-none}" >>"$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-foreman-job-${{ steps.upstream.outputs.version || github.run_id }}
          path: dist/release-foreman-job.env
          retention-days: 90

      - name: Report the failure
        if: failure()
        run: echo "::error title=Image delivery failed::this run was not recorded as published — a partial push may have landed; check the registry before re-running."
