# TC-tech-job-01 / AC-20 的权威回归基线；**其 Job 文档 = 随仓发布的参考模板内容的唯一权威源**
# （部署清单把本文件的 Job 文档发布为 ConfigMap `foreman-job-template` 的 `job-overlay.yaml`；模板为必选部署物，ADR-030）。
# 参考模板内容的逐条约定：
#   · `<job-image>` **逐字保留**在三处容器 `image`（agent / omp / prepare；消费面见 02-contracts.md §8.3）；
#   · `omp` 由 `omp` init 容器在启动期按架构下载并校验后落到 `agent-bin` 卷，agent 容器以单文件挂载取到
#     `MULTICA_OMP_PATH` 取值处（镜像不再内置 omp；init 耗时计入 FOREMAN_JOB_BOOT_TIMEOUT）；
#   · `<preferred node>` **识别位属参考模板内容**（软亲和的取值/删除对象；缺该位则 AC-25 / AC-26 无判定对象）——
#     由 TC-tech-job-01 步骤 3a 的「CM 内容自证」断言。
#   · `metadata.name` 是**名字格式**（模板表达，ADR-034）：参考模板取 `fm-<task_id>`，A1.2 在副本上写终值；
#     名字不承担身份——`foreman.tsic.top/daemon-id`（pod 标签）才是 `MULTICA_DAEMON_ID` 的 fieldRef 来源。
# 占位符替换规则见 02-contracts.md §8.3。**条件块不在基线内**：触发上下文注解（issue-id /
# issue-identifier / autopilot-run-id / chat-session-id）由 A1.2 先清 `foreman.tsic.top/*` 域再按字段增删 ⇒ CM 写不写都不影响产物，
# 故基线（= CM 字面）不含；归一化时从实际对象删除，形状由 TC-tech-job-01（issue 触发分支）与 TC-tech-job-04（**首跑**分支）单独断言。
# **软亲和项在渲染面上的取舍（取值 → 恰一项 / 不满足条件 → 删项并上收空结构）由 TC-tech-job-01 步骤 3b 与 TC-tech-cache-05/06 断言（ADR-015）。**
# `prepare` 的 chown 目标含 `/state/workspaces`（ADR-011 / AC-13 的属主面；由 tests/acceptance/tech_security_01_permission_boundary_test.go 的字面断言锁定）。
# **daemon profile 归每个 Job 独占**（ADR-059）：profile 目录建在该 Job 的凭据卷里，节点 home 面不出现 profile 目录与令牌；
# profile 相对状态不跨任务续用。该事实的固定声明同时出现在部署说明（deploy/README.md）与本模板 prepare 的启动输出（每个任务 Job 的启动日志）里，两处逐字相同。
# prepare 仍自愈节点面的两个目录位（`.multica` 与其 `profiles` 挂载点父目录）：它们不在凭据卷内，被普通文件占用时 agent 容器的挂载建不起来；
# prepare 在 agent 容器创建前运行、又不挂该路径，是唯一能修的位置。
# 修订参考模板时：基线夹具与部署清单两处必须同 PR 同步（同一份字面，AC-20 断言逐字一致）。
# 末段 Secret 文档是该夹具的**凭据回归面**，不是模板内容（模板 = 单份 `batch/v1 Job`）。
apiVersion: batch/v1
kind: Job
metadata:
  name: fm-<task_id>
  namespace: multica-agents
  labels:
    app.kubernetes.io/name: foreman-job
    app.kubernetes.io/managed-by: foreman
    foreman.tsic.top/task-id: "<task_id>"
    foreman.tsic.top/agent-id: "<agent_id>"
    foreman.tsic.top/workspace-id: "<workspace_id>"
  annotations:
    foreman.tsic.top/daemon-id: "fm-<task_id>"
    foreman.tsic.top/job-runtime-id: "<job runtime uuid>"
    foreman.tsic.top/claimed-at: "<RFC3339>"
    foreman.tsic.top/attempt: "1"
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foreman-job
        foreman.tsic.top/task-id: "<task_id>"
        foreman.tsic.top/daemon-id: "fm-<task_id>"
        foreman.tsic.top/workspace-id: "<workspace_id>"
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      serviceAccountName: multica-omp
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: registry-tsic
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - { key: unreachable, operator: Exists, effect: NoExecute }
        - { key: maybe_unreachable, operator: Exists, effect: NoExecute }
      affinity:                                   # 参考模板内容的一部分：软亲和识别位（TC-tech-job-01 步骤 3a 自证）
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: ["<preferred node>"] }
      topologySpreadConstraints:
        - maxSkew: 3
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: foreman-job }
      initContainers:
        - name: omp
          image: <job-image>
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              case "$(uname -m)" in
                x86_64)  asset=omp-linux-musl-x64 ;;
                aarch64) asset=omp-linux-musl-arm64 ;;
                *) echo "unsupported machine: $(uname -m)" >&2; exit 1 ;;
              esac
              base=https://github.com/can1357/oh-my-pi/releases/latest/download
              wget -q -O /agent-bin/SHA256SUMS.txt "$base/SHA256SUMS.txt"
              wget -q -O /agent-bin/omp "$base/$asset"
              want=$(grep -E "[[:space:]]$asset\$" /agent-bin/SHA256SUMS.txt | cut -d' ' -f1)
              got=$(sha256sum /agent-bin/omp | cut -d' ' -f1)
              [ -n "$want" ] && [ "$want" = "$got" ] || { echo "checksum mismatch for $asset: want $want, got $got" >&2; exit 1; }
              chmod 0755 /agent-bin/omp
              rm -f /agent-bin/SHA256SUMS.txt
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: "1", memory: 256Mi }
          volumeMounts:
            - { name: agent-bin, mountPath: /agent-bin }
        - name: prepare
          image: <job-image>
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for d in /home/agent/.multica /home/agent/.multica/profiles; do
                [ -d "$d" ] || { rm -f "$d"; mkdir -p "$d"; }
              done
              mkdir -p /credout/foreman-job
              rm -rf /home/agent/.multica/daemon_task_context.json
              cp /cred/config.json /credout/foreman-job/config.json
              chmod 0400 /credout/foreman-job/config.json
              echo "profile-relative state is per-Job and is not reused across tasks"
              chown -R 1000:1000 /home/agent /state/workspaces /credout
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"], add: ["CHOWN", "DAC_OVERRIDE"] }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: home,       mountPath: /home/agent }
            - { name: workspaces, mountPath: /state/workspaces }
            - { name: cred,       mountPath: /credout }
            - { name: cred-src,   mountPath: /cred, readOnly: true }
      containers:
        - name: agent
          image: <job-image>
          imagePullPolicy: Always
          workingDir: /
          command: ["/usr/bin/dumb-init", "--", "/usr/local/bin/multica"]
          args: ["daemon", "start", "--foreground", "--profile", "foreman-job"]
          tty: true
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits:   { cpu: "4", memory: 8Gi }
          env:
            - { name: MULTICA_SERVER_URL,                  value: "http://foreman.foreman.svc.cluster.local:8080" }
            - { name: MULTICA_DAEMON_ID,                   valueFrom: { fieldRef: { fieldPath: "metadata.labels['foreman.tsic.top/daemon-id']" } } }
            - { name: MULTICA_DAEMON_DEVICE_NAME,          valueFrom: { fieldRef: { fieldPath: "spec.nodeName" } } }
            - { name: MULTICA_AGENT_RUNTIME_NAME,          value: "foreman-job" }
            - { name: MULTICA_DAEMON_MAX_CONCURRENT_TASKS, value: "1" }
            - { name: MULTICA_WORKSPACES_ROOT,             value: "/state/workspaces" }
            - { name: TMPDIR,                              value: "/tmp" }
            - { name: TMP,                                 value: "/tmp" }
            - { name: TEMP,                                value: "/tmp" }
            - { name: MULTICA_GC_ENABLED,                  value: "false" }
            - { name: MULTICA_DAEMON_AUTO_UPDATE,          value: "false" }
            - { name: MULTICA_DAEMON_AUTO_RELOAD,          value: "false" }
            - { name: MULTICA_OMP_PATH,                    value: "/usr/local/bin/omp" }
            - { name: HOME,                                value: "/home/agent" }
            - { name: LOG_LEVEL,                           value: "info" }
          volumeMounts:
            - { name: home,       mountPath: /home/agent }
            # The credential volume IS the Job's profile area at run time: the
            # daemon resolves its profile under $HOME/.multica/profiles/<name>
            # inside it, so the token file prepare wrote and every
            # profile-relative store it creates live and die with this pod.
            # The node's home face stays free of the profile directory and of
            # the token (ADR-059).
            - { name: cred,       mountPath: /home/agent/.multica/profiles }
            - { name: workspaces, mountPath: /state/workspaces }
            - { name: tmp,        mountPath: /tmp }
            - { name: agent-bin,  mountPath: /usr/local/bin/omp, subPath: omp, readOnly: true }
      volumes:
        # Node-side agent state is partitioned per workspace (§8.8): the
        # placeholder is the Job's workspace, so two workspaces on one
        # node never share sessions or memory — and the gc rounds judge
        # each workspace's tree independently. The daemon profile is not
        # here: it lives in the credential volume, per Job (ADR-059).
        - name: home
          hostPath: { path: /var/lib/foreman/home/<workspace_id>, type: DirectoryOrCreate }
        - name: workspaces
          hostPath: { path: /var/lib/foreman/workspaces, type: DirectoryOrCreate }
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
        - name: agent-bin
          emptyDir: { sizeLimit: 1Gi }
        # The Job's credential volume, now also carrying that Job's daemon
        # profile directory: the token file, pid, log and profile-relative
        # state are all pod-local, so the profile never lands on the node's
        # shared home face and two Jobs on one node cannot contend for it.
        # 512Mi is a starting value, not a measured bound: the provider's
        # profile-relative stores are what fill this volume. Size it from the
        # cold-start footprint measured on your own provider (README
        # §Node-local state).
        - name: cred
          emptyDir: { sizeLimit: 512Mi }
        - name: cred-src
          secret: { secretName: fm-<task_id>-cred, defaultMode: 0400 }
---
apiVersion: v1
kind: Secret
metadata:
  name: fm-<task_id>-cred
  namespace: multica-agents
  labels: { app.kubernetes.io/managed-by: foreman, foreman.tsic.top/task-id: "<task_id>", foreman.tsic.top/workspace-id: "<workspace_id>" }
type: Opaque
stringData:
  config.json: '{"token":"fmj_<payload>.<sig>"}'
