# ConfigMap foreman-job-policy (02-contracts.md §8.5): the optional
# carrier of the three-axis job policy (resourcePolicy / capPolicy /
# nodeSelectorPolicy). The Deployment mounts it as an *optional* read-only
# volume at /etc/foreman/policy/, so deleting this object (or applying the
# manifest with its key stripped) is a supported deployment: an absent file
# means all three axes read None, and Foreman starts with a warn.
#
# The file is loaded once at startup — editing this ConfigMap needs a Foreman
# restart (the startup log says so, and records the file's sha256).
# A file that is present must be well formed: an unreadable or unparseable one,
# a definition that writes `capabilities.drop`, or a key the platform's
# authority reports absent/ambiguous refuses startup (CrashLoopBackOff).
#
# The skeleton below is comment-only on purpose: it decodes to an empty policy,
# which is the same "no axis configured" default as an absent file. Replace it
# with real entries — see deploy/README.md §Job policy.
#
# Multi-workspace deployments MUST partition the table under
# `workspaces.<workspace_id>:`; the flat `agents` / `projects` form below is
# the single-workspace form and refuses startup when more than one workspace is
# configured (02-contracts.md §8.5 键空间 = workspace × 名字). Example:
#
#   workspaces:
#     <workspace-id-a>:
#       agents: { ... }
#       projects: { ... }
#     <workspace-id-b>:
#       agents: { ... }
#
# The partition key may also be the workspace's display name — the identifier
# form always works; the display-name form is resolved once at startup and
# refuses the boot when it matches more than one workspace. A rename
# invalidates the old name: the next start refuses until the key is updated.
#
# The single-workspace example:
#
#   agents:
#     omp-default:
#       resourcePolicy: projectWithAgent
#       capPolicy: agent
#       nodeSelectorPolicy: agent
#       resources:
#         requests: { cpu: "1", memory: 2Gi }
#         limits:   { cpu: "4", memory: 8Gi }
#       capabilities:
#         add: ["SYS_ADMIN"]
#       nodeSelector:
#         kubernetes.io/os: linux
#   projects:
#     foreman:
#       resources:
#         requests: { cpu: "500m" }
#       capabilities:
#         add: ["NET_ADMIN"]
#       nodeSelector:
#         disktype: ssd
#
# Keys are names (agent.name / the project name), compared by exact equality —
# the startup name resolution's authority answers each key, whatever its
# literal shape; a key the authority reports absent refuses the boot. The
# capability axis only appends to the container's `add` list and keeps the
# template's `drop` list: the policy file is not a security boundary and the
# capability names are not whitelisted (see README.md §Risk disclosure).
apiVersion: v1
kind: ConfigMap
metadata:
  name: foreman-job-policy
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
    app.kubernetes.io/component: job-policy
data:
  policy.yaml: |
    # No axes configured: all three read None (the legal default).
