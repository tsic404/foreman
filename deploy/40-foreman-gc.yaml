# foreman-gc: node-local cache collector, one pod per node (contracts §5.3,
# 05-modules/job-template.md §节点清理, ADR-005).
#
# Cleanup runs in the node's state root mounted at /state — never inside a Job
# pod, because concurrent pods cannot safely judge each other's directories.
# The image is the Job image (it ships foreman-gc alongside the daemon CLI and
# omp), the same reference literal as FOREMAN_JOB_IMAGE in 30-foreman.yaml —
# see deploy/README.md §Images.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: foreman-gc
  namespace: multica-agents
  labels:
    app.kubernetes.io/name: foreman-gc
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: foreman-gc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foreman-gc
    spec:
      serviceAccountName: foreman-gc
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry-tsic
      nodeSelector:
        kubernetes.io/os: linux
      # Every node carries a cache, including tainted ones.
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: foreman-gc
          # Same movable reference as FOREMAN_JOB_IMAGE (ADR-012); Always so a
          # moved tag reaches every node instead of a stale cached layer.
          image: ghcr.io/tsic404/foreman-job:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/foreman-gc"]
          env:
            # The hostPath below is mounted here; on the node the same tree is
            # ${FOREMAN_STATE_ROOT} (contract §5.1).
            - name: FOREMAN_STATE_ROOT
              value: "/state"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FOREMAN_CACHE_TTL
              value: "720h"
            - name: FOREMAN_TASK_DIR_TTL
              value: "168h"
            # Node-local agent state under ${FOREMAN_STATE_ROOT}/home: the
            # session/transcript stores, pi-sessions and codex stores follow
            # the state TTL, hermes memory the (deliberately long) memory TTL.
            # "0" turns the corresponding rule off (contract §5.1).
            - name: FOREMAN_AGENT_STATE_TTL
              value: "336h"
            - name: FOREMAN_AGENT_MEMORY_TTL
              value: "2160h"
            - name: FOREMAN_CACHE_MAX_BYTES
              value: "50Gi"
            - name: FOREMAN_GC_QUIESCE
              value: "30m"
            - name: FOREMAN_GC_INTERVAL
              value: "6h"
            - name: FOREMAN_LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
      volumes:
        - name: state
          hostPath:
            # Must equal the node-side FOREMAN_STATE_ROOT (default
            # /var/lib/foreman); kubelet creates it on first use.
            path: /var/lib/foreman
            type: DirectoryOrCreate
