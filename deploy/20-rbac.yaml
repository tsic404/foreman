# ServiceAccounts (v2).
#
# v2 creates no Kubernetes objects: there is no per-task Job, no per-task
# Secret, no node-local cache DaemonSet. Foreman therefore needs no Role at
# all — the scheduler talks only to the multica server and to the daemons that
# dial it, never to the Kubernetes API. This file keeps the ServiceAccount the
# Deployment runs as; the API token is not automounted.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foreman
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
# No Kubernetes API access is required, so the token is never mounted.
automountServiceAccountToken: false
