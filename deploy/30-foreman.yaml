# Foreman v2 Deployment + Services.
#
# v2 has no per-task Kubernetes objects: Foreman registers to the multica
# server as one daemon per workspace, claims tasks, and hands each to a
# long-lived registered multica daemon. The long-lived daemons dial this
# Deployment's daemon face (:8080) with their operator-issued credential; the
# ops surface (:8081) is credential-gated.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foreman
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: foreman
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foreman
        app.kubernetes.io/component: scheduler
      annotations:
        # The metric endpoint is on the ops listener, not the daemon face.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: foreman
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry-tsic
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: foreman
          image: ghcr.io/tsic404/foreman:latest
          imagePullPolicy: Always
          args: ["-listen=:8080", "-ops-listen=:8081"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: ops
              containerPort: 8081
              protocol: TCP
          env:
            # --- server identity / credentials ---
            - name: MULTICA_SERVER_URL
              value: "http://multica.tsic.top"
            # Credential form. This file ships the legacy single-workspace
            # form: one workspace-scoped credential.
            #   • one user-scoped credential + no workspace id ⇒ discovery:
            #     the startup C-17 lists every workspace the credential sees;
            #     FOREMAN_DAEMON_ID is the base identity, each workspace's
            #     identity derives from it. Optional narrowing manifest:
            #     FOREMAN_WORKSPACES_MANIFEST[_FILE].
            #   • per-workspace credentials ⇒ drop MULTICA_WORKSPACE_ID and
            #     mount FOREMAN_WORKSPACES_FILE.
            - name: MULTICA_WORKSPACE_ID
              value: "f311e8ff-e026-4c6e-b267-dcc004f08782"
            - name: MULTICA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: foreman-secret
                  key: MULTICA_TOKEN
            - name: FOREMAN_DAEMON_ID
              value: "foreman"
            # --- the long-lived daemons that register to Foreman ---
            # Their operator-issued credential set (see 10-secrets.yaml).
            - name: FOREMAN_DAEMON_TOKENS
              valueFrom:
                secretKeyRef:
                  name: foreman-daemons
                  key: FOREMAN_DAEMON_TOKENS
            - name: FOREMAN_DAEMON_TOKEN_WORKSPACES
              valueFrom:
                secretKeyRef:
                  name: foreman-daemons
                  key: FOREMAN_DAEMON_TOKEN_WORKSPACES
            # --- claim / dispatch ---
            - name: FOREMAN_CLAIM_INTERVAL
              value: "5s"
            - name: FOREMAN_CLAIM_INTERVAL_IDLE
              value: "30s"
            # Daemon-identity heartbeat cadence (C-2); values above 20s are
            # refused at startup. The name is historical: task leases are
            # renewed by C-4 from the convergence round below, and by the
            # daemon itself via S-7.
            - name: FOREMAN_LEASE_REFRESH_INTERVAL
              value: "15s"
            - name: FOREMAN_RECONCILE_INTERVAL
              value: "30s"
            # Boot window: claim → daemon start. A long-lived daemon starts
            # immediately (no image pull, no agent download), so the default is
            # far below v1's 300s pod window.
            - name: FOREMAN_JOB_BOOT_TIMEOUT
              value: "60s"
            # --- observability ---
            - name: FOREMAN_LOG_LEVEL
              value: "info"
            - name: FOREMAN_OPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: foreman-secret
                  key: FOREMAN_OPS_TOKEN
          livenessProbe:
            httpGet:
              path: /foreman/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /foreman/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
# Daemon face: the address the long-lived daemons dial. Only this port is
# published.
apiVersion: v1
kind: Service
metadata:
  name: foreman
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
    app.kubernetes.io/component: scheduler
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: foreman
    app.kubernetes.io/component: scheduler
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Ops face: metrics + task projections, credential-gated.
apiVersion: v1
kind: Service
metadata:
  name: foreman-ops
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
    app.kubernetes.io/component: scheduler
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: foreman
    app.kubernetes.io/component: scheduler
  ports:
    - name: ops
      port: 8081
      targetPort: ops