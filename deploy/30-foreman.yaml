# Foreman v2 Deployment + Services.
#
# v2 has no per-task Kubernetes objects: Foreman registers to the multica
# server as one daemon per workspace, claims tasks, and hands each to a
# long-lived registered multica daemon. The long-lived daemons dial this
# Deployment's daemon face (:8080) with their operator-issued credential; the
# ops surface (:8081) is credential-gated.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foreman
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: foreman
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foreman
      annotations:
        # The metric endpoint is on the ops listener, not the daemon face.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      # No Kubernetes API access: v2 spawns no per-task objects, so the pod
      # runs without a service-account token. ghcr.io is reachable
      # anonymously for this repository, so no imagePullSecret is needed.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: foreman
          image: ghcr.io/tsic404/foreman:v2
          imagePullPolicy: IfNotPresent
          args: ["-listen=:8080", "-ops-listen=:8081"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: ops
              containerPort: 8081
              protocol: TCP
          env:
            # --- server identity / credentials ---
            - name: MULTICA_SERVER_URL
              value: "http://backend.multica.svc.cluster.local:8080"
            # Credential form: one user-scoped credential, no workspace id, so
            # startup's C-17 discovery serves every workspace the credential
            # can see. FOREMAN_DAEMON_ID is the base identity and each
            # workspace's identity derives from it as <base>-<workspace-id>.
            #
            # A workspace-scoped credential instead takes MULTICA_WORKSPACE_ID
            # (single workspace). Setting that and FOREMAN_WORKSPACES_MANIFEST
            # together is refused; the manifest narrows a discovery set.
            - name: MULTICA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: foreman-secret
                  key: MULTICA_TOKEN
            - name: FOREMAN_DAEMON_ID
              value: "foreman"
            # --- the long-lived daemons that register to Foreman ---
            # Their operator-issued credential set (see 10-secrets.yaml).
            - name: FOREMAN_DAEMON_TOKENS
              valueFrom:
                secretKeyRef:
                  name: foreman-daemons
                  key: FOREMAN_DAEMON_TOKENS
            - name: FOREMAN_DAEMON_TOKEN_WORKSPACES
              valueFrom:
                secretKeyRef:
                  name: foreman-daemons
                  key: FOREMAN_DAEMON_TOKEN_WORKSPACES
            # --- claim / dispatch ---
            - name: FOREMAN_CLAIM_INTERVAL
              value: "5s"
            - name: FOREMAN_CLAIM_INTERVAL_IDLE
              value: "30s"
            # Daemon-identity heartbeat cadence (C-2); values above 20s are
            # refused at startup. The name is historical: task leases are
            # renewed by C-4 from the convergence round below, and by the
            # daemon itself via S-7.
            - name: FOREMAN_LEASE_REFRESH_INTERVAL
              value: "15s"
            - name: FOREMAN_RECONCILE_INTERVAL
              value: "30s"
            # Boot window: claim → daemon start. A long-lived daemon starts
            # immediately (no image pull, no agent download), so the default is
            # far below v1's 300s pod window.
            - name: FOREMAN_JOB_BOOT_TIMEOUT
              value: "60s"
            # --- observability ---
            - name: FOREMAN_LOG_LEVEL
              value: "info"
            - name: FOREMAN_OPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: foreman-secret
                  key: FOREMAN_OPS_TOKEN
          livenessProbe:
            httpGet:
              path: /foreman/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /foreman/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
# Daemon face: the address the long-lived daemons dial. Only this port is
# published.
apiVersion: v1
kind: Service
metadata:
  name: foreman
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
    app.kubernetes.io/component: scheduler
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: foreman
    app.kubernetes.io/component: scheduler
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Ops face: metrics + task projections, credential-gated.
apiVersion: v1
kind: Service
metadata:
  name: foreman-ops
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
    app.kubernetes.io/component: scheduler
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: foreman
    app.kubernetes.io/component: scheduler
  ports:
    - name: ops
      port: 8081
      targetPort: ops
---
# Daemon face on a NodePort: the resident daemons normally run outside the
# cluster, so the ClusterIP above is not reachable from where they live. This
# is the address they dial when no ingress is in place.
apiVersion: v1
kind: Service
metadata:
  name: foreman-daemon
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
    app.kubernetes.io/component: daemon-face
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: foreman
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
# Optional: publish the daemon face by name. The daemons' server_url can point
# here instead of at a node IP, which survives node renumbering.
#
# Note this ingress publishes the daemon face only (8080); the ops face stays
# cluster-internal.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foreman
  namespace: foreman
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
spec:
  ingressClassName: nginx
  rules:
    - host: foreman.tsic.top
      http:
        paths:
          - backend:
              service:
                name: foreman
                port:
                  number: 8080
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - foreman.tsic.top
      secretName: foreman-tls