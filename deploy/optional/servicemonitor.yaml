# Prometheus Operator scrape object (02-contracts.md §9.2).
#
# OPTIONAL: it needs the monitoring.coreos.com CRDs from the Prometheus
# Operator, which the base deploy/ set does not assume. The Service and the
# Deployment already carry the prometheus.io/* annotations as the
# operator-free fallback, so apply this file only on a cluster that has the
# CRDs:
#
#   kubectl apply -f deploy/optional/servicemonitor.yaml
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: foreman
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: foreman
      app.kubernetes.io/component: scheduler
      # The ops Service is the one publishing the metric port; the Job-facing
      # Service carries the same workload labels but no /metrics.
      foreman.tsic.top/surface: ops
  namespaceSelector:
    matchNames:
      - foreman
  endpoints:
    # The metric endpoint is on the ops listener (Service foreman-ops,
    # 02-contracts.md S-25), which requires the deployment's bearer credential.
    # The Operator form reads it from the same Secret the Deployment mounts.
    - port: ops
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      authorization:
        type: Bearer
        credentials:
          name: foreman-secret
          key: FOREMAN_OPS_TOKEN
