# Foreman namespaces (object names are implementation-side).
#
# `foreman` hosts the Foreman Deployment, its two Services and its credentials.
# v2 creates no Kubernetes objects of its own: there is no per-task Job, no
# node-local cache DaemonSet and no agent namespace. A deployment therefore
# needs only this one namespace.
---
apiVersion: v1
kind: Namespace
metadata:
  name: foreman
  labels:
    app.kubernetes.io/name: foreman
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
