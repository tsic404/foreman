# Secrets (v2).
#
# PLACEHOLDERS ONLY. `kubectl apply -f deploy/` will write these values, so
# replace them before applying (or create the Secrets out of band and drop this
# file from the apply set) — see deploy/README.md §Secrets.
---
# Server credential + ops credential (ns foreman).
#   MULTICA_TOKEN       mdt_/mul_ token. Workspace-scoped form: bound to
#                       FOREMAN_DAEMON_ID + MULTICA_WORKSPACE_ID. Discovery
#                       form (one user-scoped credential, no workspace id): the
#                       account's membership defines the visible set.
#   FOREMAN_OPS_TOKEN   bearer credential of the ops surface (S-25): /metrics
#                       and the task projections. A daemon never holds it, and
#                       the daemon-facing Service publishes only :8080.
#                       Generate with: head -c 32 /dev/urandom | xxd -p -c 64
---
apiVersion: v1
kind: Secret
metadata:
  name: foreman-secret
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
type: Opaque
stringData:
  MULTICA_TOKEN: "mdt_REPLACE_ME"
  # internal/observability rejects "REPLACE_ME", so an unreplaced manifest
  # CrashLoops instead of exposing the ops surface with a published token.
  FOREMAN_OPS_TOKEN: "REPLACE_ME"
---
# The daemon credential set: the long-lived multica daemons that register to
# Foreman present one of these tokens, and their daemon id is derived from the
# pair. Format (comma-separated), see deploy/README.md §Daemon credentials:
#
#   FOREMAN_DAEMON_TOKENS            "<daemon-id>=<token>[,<daemon-id>=<token>...]"
#   FOREMAN_DAEMON_TOKEN_WORKSPACES  "<daemon-id>=<workspace-id>[, ...]"
#
# A daemon identity without a workspace binding refuses startup.
apiVersion: v1
kind: Secret
metadata:
  name: foreman-daemons
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
type: Opaque
stringData:
  FOREMAN_DAEMON_TOKENS: "worker-1=REPLACE_ME"
  FOREMAN_DAEMON_TOKEN_WORKSPACES: "worker-1=f311e8ff-e026-4c6e-b267-dcc004f08782"
---
# GHCR pull secret for Foreman's own image. GHCR packages are private by
# default, so the secret needs a token with `read:packages`.
apiVersion: v1
kind: Secret
metadata:
  name: registry-tsic
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"REPLACE_ME","password":"REPLACE_ME","auth":"REPLACE_ME"}}}'