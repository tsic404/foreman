# Secrets (02-contracts.md §6, §1.1).
#
# PLACEHOLDERS ONLY. `kubectl apply -f deploy/` will write these values, so
# replace them before applying (or create the Secrets out of band and drop
# this file from the apply set) — see deploy/README.md §Secrets.
---
# Server credential + Job Token signing key (ns foreman).
#   MULTICA_TOKEN        mdt_/mul_ token. Workspace-scoped form: bound to
#                        FOREMAN_DAEMON_ID + MULTICA_WORKSPACE_ID. Discovery
#                        form (one user-scoped credential, no workspace id):
#                        the account's membership defines the visible set.
#                        Project-tier job policies additionally need the mul_
#                        form: the two read-only project-identity queries run on
#                        the user API, which does not accept mdt_ tokens
#                        (deploy/README.md §Job policy).
#   FOREMAN_JOB_TOKEN_KEY 32 random bytes hex: head -c 32 /dev/urandom | xxd -p -c 64
#   FOREMAN_STATE_PASSWORD  the shared state store credential (ADR-046 阶段一;
#                        the deployment interface list carries it, §7). The
#                        store carries token digests, mapping rows and
#                        delivery bodies, so it must be treated as a
#                        credential store (§10 安全): the shipped baseline
#                        requires authentication and this placeholder must be
#                        replaced before applying. Foreman treats an empty
#                        value — and this literal REPLACE_ME — as
#                        unauthenticated and logs state.unauthenticated, so an
#                        unreplaced manifest alarms instead of serving with a
#                        repository-published password.
apiVersion: v1
kind: Secret
metadata:
  name: foreman-secret
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
type: Opaque
stringData:
  MULTICA_TOKEN: "mdt_REPLACE_ME"
  # Not valid hex on purpose: `internal/auth` refuses to start on a
  # FOREMAN_JOB_TOKEN_KEY that does not decode, so an un-replaced placeholder
  # CrashLoops loudly instead of signing forgeable fmj_ tokens with a
  # well-known key.
  FOREMAN_JOB_TOKEN_KEY: "REPLACE_ME"
  FOREMAN_STATE_PASSWORD: "REPLACE_ME"
---
# GHCR pull secret for the Job image (ns multica-agents) and for Foreman's own
# image (ns foreman). Both must carry the same credentials; the name is the one
# the deployment uses. GHCR packages are private by default, so the
# secret needs a token with `read:packages` (deploy/README.md §Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: registry-tsic
  namespace: multica-agents
  labels:
    app.kubernetes.io/name: foreman-job
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"REPLACE_ME","password":"REPLACE_ME","auth":"REPLACE_ME"}}}'
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-tsic
  namespace: foreman
  labels:
    app.kubernetes.io/name: foreman
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"REPLACE_ME","password":"REPLACE_ME","auth":"REPLACE_ME"}}}'
